[project]
name = "btc-radar-mcp"
version = "0.2.0"
description = "Bitcoin merkezli kripto piyasa analizi için salt-okunur FastMCP sunucusu"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.10",
    "httpx>=0.27",
    "pydantic>=2.7",
    "diskcache>=5.6",
    "pyyaml>=6.0",
]

[project.scripts]
btc-radar = "btc_radar.server:main"
btc-radar-producer = "btc_radar.producer:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btc_radar"]

# uvx ile paket olarak çalıştırıldığında config/ repo kökünde bulunmaz;
# paket içine _config olarak gömülür. Çözüm sırası: env var → repo kökü → paket içi.
# Detay: docs/adr/0001-faz0-iskelet-ve-paketleme.md
[tool.hatch.build.targets.wheel.force-include]
"config" = "btc_radar/_config"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
