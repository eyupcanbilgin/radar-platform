version: "2"

producer:
  collect_interval_seconds: 300
  publish_grace_seconds: 90
  history_limit: 3

signal:
  decision_grace_seconds: 180
  # Host uyandığında producer ile Signal aynı anda devam eder ve producer_grace <
  # decision_grace sıralaması yaşanmaz (ADR-0041). Saat yuvası saat başına tek ve
  # değişmez olduğundan, context yayınlanmadan yazılan saat kalıcı olarak context'siz
  # kalır. Bu bütçe dolunca karar yine fail-closed WAIT olarak yazılır. 0 = beklemez.
  context_wait_seconds: 240

pump:
  interval_seconds: 5

coverage:
  interval_seconds: 300

readiness:
  # Hazırlık projeksiyonu (ADR-0047). Saatlik ölçekte değişen bir cevap; sık koşmasına
  # gerek yok. Salt-okunur: sonuç okumaz, Registry'ye yazmaz.
  interval_seconds: 900

health_alert:
  # Coverage ile aynı ritim: coverage raporu tazelendikçe kesinti değerlendirilsin.
  # Uyarı eşikleri saat ölçeğinde olduğu için bu aralık uyarı sıklığını belirlemez;
  # tekrar uyarıyı outbox idempotency ve escalation kovaları engeller (ADR-0042).
  interval_seconds: 300

launchd:
  throttle_interval_seconds: 10
