# Araştırma ve Ölçüm Protokolü (Phase 2 - Purged Walk-Forward + Embargo + Baselines)
# Eşikler koda gömülmez; config doğrulama fail-closed çalışır.
version: "1.0"

boundaries:
  # Locked OOS başlangıç tarihi (değişmez kilit). Varsayılan CLI ile çalıştırılamaz.
  locked_oos_start_utc: "2026-08-04T00:00:00Z"
  # Geliştirme başlangıç tarihi
  development_start_utc: "2024-01-01T00:00:00Z"

walk_forward:
  train_window_days: 90
  test_window_days: 30
  step_days: 30
  min_embargo_days: 1
  default_embargo_days: 1
  default_label_horizon_hours: 24

data_integrity:
  min_candles_per_window: 100
  max_allowed_gap_seconds: 3600
  strict_timezone_utc: true

locked_oos:
  allow_unlock_default: false

baselines:
  cost_scenario: "realistic"
  simple_trend:
    fast_period: 20
    slow_period: 50
    signal_mode: "long_short"

statistical_gates:
  version: "1.1"
  dsr:
    confidence_threshold: 0.95
    min_unique_trials: 2
  pbo_cscv:
    partitions: 8
    max_combinations: 70
    rejection_threshold: 0.05
    performance_metric: "mean_net_return"
  sensitivity:
    relative_delta: 0.20
    min_performance_retention_ratio: 0.80
  ablation:
    min_mean_contribution: 0.0
    min_positive_fold_ratio: 0.60
  fragility:
    min_period_groups: 3
    min_venue_groups: 2
    min_observations_per_group: 3
    min_worst_group_retention_ratio: 0.50
    min_positive_group_ratio: 0.67
  required_cost_scenarios: ["realistic", "taker_heavy"]
