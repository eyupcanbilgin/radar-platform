name: smoke
on:
  schedule:
    - cron: "17 6 * * *" # günlük canlı endpoint kontrolü (SPEC §6.3)
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # bitcoin-data.com günlük 15 istek bütçesi CI'da harcanmaz (CLAUDE.md kural 8)
      - run: uv run python scripts/verify_endpoints.py --skip-bitcoin-data
