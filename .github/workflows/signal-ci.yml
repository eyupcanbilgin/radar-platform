name: Signal CI

on:
  push:
    paths:
      - "services/radar-signal/**"
      - "contracts/**"
      - ".github/workflows/signal-ci.yml"
  pull_request:
    paths:
      - "services/radar-signal/**"
      - "contracts/**"
      - ".github/workflows/signal-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: services/radar-signal
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/radar-signal/requirements.lock
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: python -m ruff check
      - run: python -m ruff format --check
      - run: python -m pytest -q
