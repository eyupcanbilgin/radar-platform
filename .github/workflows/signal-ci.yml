name: Signal CI

on:
  push:
    paths:
      - "services/radar-signal/**"
      - "contracts/**"
      - ".github/workflows/signal-ci.yml"
  pull_request:
    paths:
      - "services/radar-signal/**"
      - "contracts/**"
      - ".github/workflows/signal-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: services/radar-signal
    steps:
      # İnceleme kapısı testleri gerçek git geçmişine bakar (reviewed_commit HEAD'in atası
      # mı?). Varsayılan sığ klonda (depth=1) HEAD'in atası yoktur ve test ortam yüzünden
      # kırılır — kod yüzünden değil. Tam geçmiş bu yüzden zorunlu.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/radar-signal/requirements.lock
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: python -m ruff check
      - run: python -m ruff format --check
      - run: python -m pytest -q
      # Registry encoding bütünlüğü: 4 Ağu 2026'da 7 satır cp1254 ile yazılmış ve
      # read_all() çökmüştü. Ayrı adım olarak koşar ki hata mesajı CI'da net görünsün.
      - run: python scripts/repair_registry_encoding.py --check
      # Manifest ↔ veri eşleşmesi. CI runner'ında ham veri git dışı olduğu için
      # "hiç veri yok" hata sayılmaz; ama veri KISMEN varsa veya bir dosyanın hash'i
      # tutmuyorsa CI kırmızıya düşer — asıl yakalanmak istenen sınıf budur.
      - name: Veri manifesti doğrulaması
        run: python scripts/data_manifest.py --verify --allow-missing-data
