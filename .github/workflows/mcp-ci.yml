name: MCP CI

on:
  push:
    paths:
      - "services/btc-radar-mcp/**"
      - "contracts/**"
      - ".github/workflows/mcp-ci.yml"
  pull_request:
    paths:
      - "services/btc-radar-mcp/**"
      - "contracts/**"
      - ".github/workflows/mcp-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/btc-radar-mcp
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: services/btc-radar-mcp
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
