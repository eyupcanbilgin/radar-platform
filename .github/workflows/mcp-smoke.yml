name: MCP Smoke

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/btc-radar-mcp
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: services/btc-radar-mcp
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      # bitcoin-data.com günlük istek bütçesi CI'da harcanmaz.
      - run: uv run python scripts/verify_endpoints.py --skip-bitcoin-data
