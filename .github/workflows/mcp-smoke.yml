name: MCP Smoke

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/btc-radar-mcp
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: services/btc-radar-mcp
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      # bitcoin-data.com günlük istek bütçesi CI'da harcanmaz.
      #
      # GitHub-hosted runner bölgesi Binance/CloudFront tarafında coğrafi olarak engellidir.
      # Script bunları "blocked_in_environment" olarak raporlar ve çıkış kodunu bozmaz; bu
      # koşu Binance zincirini DOĞRULAMAZ. Kanıt, engellenmemiş bir ağdan `make smoke`
      # (gerekirse --fail-on-blocked) ile üretilir. Gerekçe:
      # services/btc-radar-mcp/docs/adr/0009-cografi-engel-siniflandirmasi.md
      - name: Verify endpoints
        shell: bash
        run: |
          uv run python scripts/verify_endpoints.py --skip-bitcoin-data \
            --json-out verify-endpoints.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-endpoints
          path: services/btc-radar-mcp/verify-endpoints.json
          if-no-files-found: warn
